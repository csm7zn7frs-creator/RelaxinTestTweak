name: Check sources

on:
  push:
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          test -f Makefile
          test -f control
          test -f entitlements.plist
          test -f tweak/Tweak.x
          test -f app/RootViewController.m
          test -f Resources/Info.plist
